[project]
name = "rappi-caso3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.61.0",
    "plotly>=6.9.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.8.0",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests que requieren PostgreSQL corriendo (docker compose up)",
]

[tool.ruff.lint]
ignore = ["BLE001", "F401", "F841", "SIM102", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]
