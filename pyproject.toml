[project]
name = "rappi-caso3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.61.0",
    "plotly>=6.9.0",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests que requieren PostgreSQL corriendo (docker compose up)",
]

[tool.ruff.lint]
ignore = ["BLE001", "F401", "F841", "SIM102", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]
